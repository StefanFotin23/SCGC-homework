prometheus:
  server:
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'promexporter'
        static_configs:
          - targets:
            - 'promexporter.default.svc.cluster.local:9113'
    service:
      # Expose Prometheus server on port 9090 (default HTTP port for Prometheus)
      port: 9090                 # This is the internal port exposed on the Prometheus service
      targetPort: 9090           # This is the internal port on the Prometheus pod/container
      nodePort: 30090            # This is the external node port (on your Kubernetes nodes) if you want it exposed externally
      type: NodePort             # You can use NodePort to expose it externally

