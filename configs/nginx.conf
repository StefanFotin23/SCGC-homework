server {
    listen 80;
    server_name localhost;

    location / {
        # Your custom HTML content here (you can change this to an index.html)
        root /usr/share/nginx/html;
        index index.html;
    }

    # Metrics endpoint for Prometheus scraping
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}

